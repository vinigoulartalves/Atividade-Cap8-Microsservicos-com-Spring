services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: ecodenuncia-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: ecodenuncia
      APP_USER_PASSWORD: ecodenuncia
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build: .
    container_name: ecodenuncia-api
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ORACLE_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      ORACLE_USER: ecodenuncia
      ORACLE_PASSWORD: ecodenuncia
      JWT_SECRET: ecodenuncia-jwt-secret-key-minimo-32-caracteres-academico
    ports:
      - "8080:8080"
