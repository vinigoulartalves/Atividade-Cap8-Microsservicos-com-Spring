spring.application.name=ecodenuncia-api

# =====================================================================
# Datasource - Oracle Database FIAP (remoto)
# =====================================================================
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=RM564616
spring.datasource.password=120196
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# =====================================================================
# JPA / Hibernate
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================================
# Flyway (migrations Oracle)
# =====================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =====================================================================
# Servidor
# =====================================================================
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================================================
# Seguranca / JWT (valores fixos nesta versao academica)
# Chave em Base64 (HS256+). Em producao, gere uma chave nova e segura.
# =====================================================================
security.jwt.secret=Y2hhdmUtc2VjcmV0YS1zdXBlci1zZWd1cmEtcGFyYS1lY29kZW51bmNpYS1hcGktdXNvLWFjYWRlbWljby1zb21lbnRlLTEyMzQ1Njc4OTA=
security.jwt.expiration-ms=3600000
security.jwt.issuer=ecodenuncia-api

# =====================================================================
# Logging
# =====================================================================
logging.level.org.springframework.security=INFO
logging.level.br.com.ecodenuncia=INFO
