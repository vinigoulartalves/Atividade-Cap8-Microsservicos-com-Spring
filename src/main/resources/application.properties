spring.application.name=ecodenuncia-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:ECODENUNCIA}
spring.datasource.password=${DB_PASSWORD:ecodenuncia123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.jwt.secret=${JWT_SECRET:ecodenuncia-api-secret-key-for-academic-project-2026}
api.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
