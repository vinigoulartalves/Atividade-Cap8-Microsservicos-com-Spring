spring:
  application:
    name: ecodenuncia-api
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${ORACLE_USER:ecodenuncia}
    password: ${ORACLE_PASSWORD:ecodenuncia}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:ecodenuncia-jwt-secret-key-minimo-32-caracteres-academico}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
