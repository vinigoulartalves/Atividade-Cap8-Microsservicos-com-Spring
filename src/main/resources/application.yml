server:
  port: 8080

spring:
  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${ORACLE_DB_USERNAME:ecodenuncia}
    password: ${ORACLE_DB_PASSWORD:ecodenuncia}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:ZWNvZGVudW5jaWEtc2VjcmV0LWNoYXZlLWFjYWRlbWljYS1wYXJhLXN0dWRvLTAx}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
