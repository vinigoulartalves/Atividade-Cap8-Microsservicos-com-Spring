spring:
  application:
    name: ecodenuncia-api

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:ecodenuncia}
    password: ${DB_PASSWORD:ecodenuncia}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

security:
  jwt:
    # Chave em Base64 (default e apenas para uso academico/local; troque em producao)
    secret: ${JWT_SECRET:Y2hhdmUtc2VjcmV0YS1zdXBlci1zZWd1cmEtcGFyYS1lY29kZW51bmNpYS1hcGktdXNvLWFjYWRlbWljby1zb21lbnRlLTEyMzQ1Njc4OTA=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: ${JWT_ISSUER:ecodenuncia-api}

logging:
  level:
    org.springframework.security: INFO
    br.com.ecodenuncia: INFO
